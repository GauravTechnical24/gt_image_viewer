name: gt_image_viewer
description: A universal Flutter image viewer package supporting network images with caching, SVG rendering, and Lottie animations with configurable containers.
version: 1.0.0
homepage: https://github.com/GauravTechnical24/gt_image_viewer.git
repository: https://github.com/GauravTechnical24/gt_image_viewer.git
issue_tracker: https://github.com/GauravTechnical24/gt_image_viewer/issues

topics:
  - images
  - svg
  - lottie
  - cache
  - widgets

environment:
  sdk: ^3.9.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  lottie: ^3.3.2
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
